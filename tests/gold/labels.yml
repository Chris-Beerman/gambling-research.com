# The hand-checked set. Each study here was read (title, abstract, and the
# publisher's record where needed) and its correct tags written down by hand.
# The nightly run scores the index against these answers; see pipeline/gold.py.
#
#   keep: false            not a gambling study: must be absent from the main index
#   designs: [...]         the complete set of designs, in any order
#   settings: [...]        where the study was done (ISO country codes); [] = not stated
#   topics: [...]          topics that must be present (others may be too)
#   not_topics: [...]      topics that must not be present
#
# A field is left out when the record does not settle it. The answers are not
# tuned to the rules: where the rules get one wrong, the score shows it.

thresholds:
  keep: 0.95
  designs: 0.75
  settings: 0.80
  topics: 0.80

