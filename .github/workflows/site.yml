name: Build and deploy

on:
  schedule:
    - cron: "17 6 * * *"        # nightly, 06:17 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill (wider window; first_seen from source dates)"
        type: boolean
        default: false
      only:
        description: "Comma-separated sources to run (pubmed,openalex,crossref,journals,news,trials,bills,courts); empty = all"
        type: string
        default: ""
      rebuild:
        description: "Rebuild: re-read every study since backfill_from and re-apply the tagging rules"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install the search indexer
        run: npm ci --no-audit --no-fund

      - name: Fetch sources and update the index
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.rebuild }}" = "true" ]; then ARGS="$ARGS --rebuild"; fi
          python -m pipeline.fetch $ARGS

      # Score the index against the hand-checked studies (tests/gold/labels.yml).
      # If a rule change made it worse, stop here: nothing is committed or published.
      - name: Check tagging against the hand-checked set
        if: github.event_name != 'push'
        run: python -m pipeline.gold check

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "index: update $(date -u +%Y-%m-%d)"
            # Someone may have pushed while the fetch ran; replay the data commit on top.
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Build the site
        run: python -m pipeline.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only main is published; a manual run on another branch fetches and builds without deploying.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
