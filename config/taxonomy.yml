# Tagging rules. Patterns are case-insensitive regular expressions applied to
# title + abstract (papers) or title + summary (news). Order matters only for
# the "primary" news category.

# Bump `version` whenever a rule below changes what gets kept or how it is
# tagged: the next nightly run then re-reads every study in the index and
# re-applies the rules, so old entries get the same treatment as new ones.
version: 3

# A paper is kept when it matches at least one strong term and is not explained
# away by an exclusion (e.g. the Iowa Gambling Task in a neuroscience paper).
relevance:
  strong:
    - "gambling|gamblers?\\b"
    - "\\bbettors?\\b"
    - "sports betting|sports wagering|sportsbook|online betting|betting (app|shop|site|market|behavio|harm|advert|operator|compan)|in.play betting"
    - "casinos?\\b"
    - "slot machine|electronic gaming machine|\\bEGMs?\\b|poker machine|pokies|video lottery|fixed.odds betting"
    - "lottery tickets?|lottery (play|gambl|products?|games?|sales|retailer|participation)|national lotter|state lotter|\\blotto\\b|scratch.?cards?|instant (lottery|ticket)"
    - "loot box"
    - "prediction markets?|event contracts?|\\bkalshi\\b|polymarket"
    - "daily fantasy|fantasy sports"
    - "esports betting|skin betting|skin gambling"
    - "bookmakers?\\b|bookmaking|licensed betting|betting (industry|regulation|licen|legali[sz]|law|tax|platforms?|companies|firms|sponsor|odds|exchanges?)|sports? bets?\\b"
    - "draftkings|fanduel|bet365|betway|sportpesa|betwinner|1xbet|betmgm|flutter entertainment|entain\\b"
    - "caixas? de recompensa|cajas? de bot[ií]n|lootbox"
    - "junkets?\\b|gaming (concessions?|licen[cs]es?|regulat|laws?|operators?|tax|revenues?|control board|commission|venues?)"
    - "problem gambl|gambling disorder|ludomani|ludopat"
    # Gambling in the other languages the index sees most, so non-English titles count.
    - "gl[üu]cksspiel|sportwett|jeux? d.argent|paris sportifs|apuestas?\\b|juego patol|juegos? de azar|jogos? de azar|apostas|azzardo|scommess|rahapel|peliriippuv|spelberoende|spelproblem|spel om pengar|pengespill|kumarbaz|kumar (bağımlı|oyna|davran)|\\bbahis|\\bjudi (online|daring|slot|bola|togel)|perjudian|hazardu|азартн|賭博|赌博|博彩|彩票|도박|ギャンブル|قمار|مراهن|ميسر|maysir"
  # These count as strong only when another strong term also appears. On their own
  # they mark the record as possibly related: "self-exclusion" is also a term in
  # social psychology and machine learning, "wager" a philosophy term, "lotteries"
  # the choice options of decision science, "gamble" a metaphor.
  ambiguous:
    - "self.exclu"
    - "\\bwager"
    - "lotteries"
    - "\\bgambles?\\b|\\bgambled\\b"
    - "\\bparlay"
    - "\\bpoker\\b|roulette|blackjack"
  # If one of these matches and nothing else does, the paper is kept but marked low relevance.
  weak:
    - "\\blottery\\b"
    - "\\bbetting\\b"
    - "\\bbet\\b"
  exclude_contexts:
    - "iowa gambling task"
    - "\\bgambling task\\b"
    - "cambridge gambling task|balloon analogue risk task|game of dice task"
    - "lottery (incentive|voucher|based|draw for|system for|allocation|assignment|mechanism|hypothesis|model of|competition)|by lottery|lottery design|randomi[sz]ed lottery|postcode lottery|competitive lottery|genetic lottery|birth lottery"
    - "gambl\\w* (on|with) (the |our |their |its |a |his |her )?(future|economy|lives|health|climate|planet|stability|nature|constitution|democracy|science|reputation|careers?)"
    - "gambl\\w* for (re.?election|resurrection|redemption|survival)"
    - "(won|win|winning) .{0,30}(the )?lottery"
    - "standard gamble"                      # health-economics utility elicitation
    - "\\(wager & dixon\\)|wager & dixon"     # botanist, not a bet
    - "procter\\s*(&|&amp;|\\\\&|and)\\s*gamble"       # the company
    - "testing by betting|betting (martingale|score|interpretation)|game.theoretic (probability|statistics)|\\be.values?\\b"  # statistics
    - "pascal.s wager"
    - "casino shifts?|casino.style (shift|schedule)"   # a work schedule in emergency medicine
    - "(experimental )?gambl\\w* (approach|method|game|experiment)s? (to|was used to|for) (elicit|measur|assess)[^.]{0,40}risk|(elicit|measur)\\w* risk (preferences|attitudes|aversion)[^.]{0,60}gambl\\w*"
  # Titles that mark promotional or machine-generated content; dropped outright.
  drop_titles:
    - "promo code|code promo|bonus code|welcome bonus|free spins|no deposit|referral code"
    - "complete guide to|ultimate guide|how to (play|win|bet|develop)|best (online )?(casinos?|betting sites?|sportsbooks?)|top \\d+ (online )?casinos?|casino sites|betting sites|review \\d{4}"
    - "breakthrough mining|leads extracted|provably fair|crypto casino"
  # Journals whose papers reach the index only through stray mentions. Matched
  # against the journal name; a study can still be added by hand in corrections.yml.
  exclude_journals:
    - "applied optics|optics express|environmental microbiology|angewandte chemie|journal of the american chemical society|physical review"
    - "middle european scientific bulletin|journal of investing\\b"
  # A record that only OpenAlex supplies (its search is loose) must name the subject
  # in its title, or mention it at least this many times in the abstract with one
  # mention in the opening sentences.
  openalex_only_abstract_hits: 3
  openalex_only_early_chars: 400
  # Any other record without a strong term in its title needs this many mentions in
  # the abstract to be listed in the main index; with fewer it is "possibly related".
  # This keeps out papers on other subjects that list gambling once among many.
  min_abstract_hits_without_title: 2

# Same idea for news headlines: at least one inclusion match.
news_include:
  - "gambl"
  - "\\bbet(s|ting|tor|tors)?\\b"
  - "\\bwager"
  - "sportsbook"
  - "casino"
  - "lotter"
  - "slot machine|\\bslots\\b"
  - "prediction market|event contract|kalshi|polymarket"
  - "self.exclusion"
  - "gaming (board|commission|regulator|control|authority|act)"
  - "daily fantasy|\\bDFS\\b|sweepstakes"
  - "loot box"
  - "\\bodds\\b"
news_exclude:
  - "\\bodds\\b.*(election|poll|weather)"   # "odds" in non-betting senses
  - "video game(s)? (review|sales)"
  # Picks, previews and promo-code content from affiliate sites
  - "\\bvs\\.? .*\\b(odds|picks?|predictions?|preview|props|parlay)\\b"
  - "promo code|bonus code|best bets?\\b|player props|odds today|betting preview|parlay picks|odds, picks|picks and predictions|how to bet on|betting guide|sportsbook promo|sign.up bonus"
  - "hires and higher.ups|people moves|executive (appointments|moves)"
  - "referral code|\\bcode\\b.{0,12}(bonus|free|\\$)|\\$\\d+ (kalshi|polymarket|draftkings|fanduel|betmgm|caesars|bet365)|market combos|\\bcombos\\b|^focus on [A-Z]"

# Bills (title + abstract + subjects). Stricter than news: "gaming" alone is
# video games in many bills, so it needs a gambling context.
bills_include:
  - "gambl"
  - "sports (betting|wagering|book|pool)|sportsbook|\\bbet(s|ting|tors?)?\\b"
  - "\\bwager"
  - "casino|racino|riverboat"
  - "lotter"
  - "slot machine|video gaming terminal|video lottery|electronic gaming|gaming machine|\\bVGTs?\\b|\\bVLTs?\\b"
  - "prediction market|event contract|\\bkalshi\\b"
  - "self.exclusion"
  - "gaming (board|commission|regulat|control|authority|act|compact|facility|facilities|licen[cs]e|operator|revenue|tax|fund)|(charitable|tribal|indian|internet|online|interactive|i)gaming|igaming"
  - "daily fantasy|fantasy (sports|contest)|sweepstakes|pari.?mutuel|horse rac|racetrack|\\bbingo\\b|\\bkeno\\b|\\bpoker\\b|raffle"
  - "loot box"
bills_exclude:
  - "video game (rating|content|violence)"

# Court records. A record is kept when the case NAME names a gambling party
# (cases_name), or when the matched passage or docket entry is ABOUT gambling
# (cases_text) rather than citing a case with Casino in its name or mentioning a
# visa lottery. Dockets whose only link is a casino defendant's name are dropped
# unless the name shows a regulator, a state, a tribe or an operator in a policy
# dispute (handled in pipeline/trackers.py).
cases_name:
  - "gambl|casino|lotter|sportsbook|\\bwager|\\bbetting\\b|\\bbets?\\b|kalshi|polymarket|prediction market|event contract"
  - "gaming (commission|board|control|authority|association|compact|enterprise|corporation)|gam\\.? (control|comm)|control b(oar)?d\\.?|racing commission|racing (board|association)"
  - "draftkings|fanduel|underdog|prizepicks|robinhood|crypto\\.com|coinbase|sweepstakes|loot box"
  - "rancheria|band of|tribe\\b|tribal|pueblo|indians\\b|\\bigra\\b|\\bbingo\\b|\\bpoker\\b|fantasy sports|daily fantasy|\\bslots?\\b|racetrack|\\bracino"
cases_text:
  - "gambling (disorder|addiction|problem|law|statute|act|device|machine|business|operation|offen|debt|loss|winnings|revenue|tax|licens|regulat|compact|contract|activit|enterprise|establishment|industry|operator|promotion|advertis)|illegal gambling|unlawful gambling|problem gambl|pathological gambl|compulsive gambl|\\bgamblers?\\b"
  - "sports (betting|wagering|book|gambling)|sportsbook|\\bbetting\\b|\\bwagering\\b|\\bwagers?\\b|bookmak"
  - "casino (licens|gaming|operat|revenue|tax|patron|floor|industry|regulat|compact|act\\b)|indian gaming|\\bigra\\b|gaming compact|tribal gaming|class (ii|iii) gaming|gaming (commission|control|board|act|device|machine|licens|regulat|revenue|tax)"
  - "lottery (act|commission|ticket|winnings|game|sales|retailer|proceeds|corporation|prize)|state lottery|scratch.?off|powerball|mega millions|\\blotto\\b|\\bkeno\\b"
  - "slot machine|video gaming|video lottery|gaming terminal|poker machine|electronic gaming|skill game"
  - "prediction market|event contract|kalshi|polymarket|sweepstakes casino|sweepstakes (game|model|platform|site)|daily fantasy|fantasy sports|draftkings|fanduel|loot box|self.exclusion|wire act|uigea|unlawful internet gambling|internet gambling|online gambling"
cases_exclude:
  # Citations to other cases with a gambling party ("Venetian Casino Resort v. EEOC"; "Zafar v. State Lottery Comm'n").
  - "[A-Za-z][\\w.'&-]*( [A-Za-z][\\w.'&-]*){0,6} (casino|lottery|gaming|gambling)[^,;()]{0,40} v\\. "
  - "\\bv\\. [^,;()]{0,50}(lottery|casino|gaming|gambling)[^,;()]{0,40}(comm|com\\b|corp|resort|div|inc|llc|l\\.l\\.c|bd|board|co\\b|p.ship|fund|dev|ass.n|hotel)"
  - "visa lottery|h-1b lottery|diversity.visa|lottery system|lottery for|by lottery|chosen by lottery|selected .{0,20}lottery|license lottery|licenses? .{0,30}lottery|lottery .{0,20}(licens|permit|admission|housing|vaccin|draft)"
  - "\\bgambl\\w* (on|with) (the|a|his|her|their|our) (future|life|lives|health|economy|outcome|verdict)"

news_categories:
  - slug: public-health
    label: public health and treatment
    patterns:
      - "problem gambling|gambling addiction|gambling disorder|gambling harm"
      - "helpline|1-800-GAMBLER|treatment|counsel|self.exclusion|responsible (gambling|gaming)|safer gambling"
      - "public health|suicide|addiction|harm"
  - slug: research
    label: research in the news
    patterns:
      - "\\bstudy\\b|\\bstudies\\b|research|survey|report finds|data show|journal|university|researchers"
  - slug: prediction-markets
    label: prediction markets
    patterns:
      - "prediction market|event contract|kalshi|polymarket|\\bCFTC\\b|robinhood|crypto\\.com|sports event contract"
  - slug: regulation
    label: regulation and law
    patterns:
      - "\\bbill\\b|legislat|lawmaker|senate|house (committee|bill)|governor|attorney general"
      - "lawsuit|court|ruling|judge|appeal|injunction|supreme court|circuit"
      - "regulat|gaming (board|commission|control|authority)|licen[cs]e|\\bban\\b|\\btax\\b|cease.and.desist|settlement|fine[ds]?\\b|enforcement"
  - slug: industry
    label: industry
    patterns:
      - "revenue|handle|earnings|launch|partnership|acquisition|merger|market share|quarter|stock|shares|sportsbook|operator|promo"

# Topics for papers. A paper can carry several. A match in the title counts as
# two, a match in the abstract as one; a topic needs `min_hits` (default 1), so
