# Tagging rules. Patterns are case-insensitive regular expressions applied to
# title + abstract (papers) or title + summary (news). Order matters only for
# the "primary" news category.

# A paper is kept when it matches at least one strong term and is not explained
# away by an exclusion (e.g. the Iowa Gambling Task in a neuroscience paper).
relevance:
  strong:
    - "gambl"
    - "\\bbettor"
    - "sports betting|sports wagering|sportsbook|online betting|betting (app|shop|site|market|behavio)"
    - "\\bwager"
    - "casino"
    - "slot machine|electronic gaming machine|\\bEGMs?\\b|poker machine|pokies|video lottery|fixed.odds betting"
    - "lottery ticket|lotteries|\\blotto\\b|scratch.?card|instant ticket"
    - "loot box"
    - "prediction market|event contract"
    - "self.exclusion|self.excluded"
    - "daily fantasy|fantasy sports"
    - "esports betting|skin betting|skin gambling"
    - "bookmaker"
    - "\\bparlay"
  # If one of these matches and nothing else does, the paper is kept but marked low relevance.
  weak:
    - "\\blottery\\b"
    - "\\bbetting\\b"
    - "\\bbet\\b"
  exclude_contexts:
    - "iowa gambling task"
    - "\\bgambling task\\b"
    - "lottery (incentive|voucher|based|draw for|system for|allocation|assignment|mechanism)|by lottery|lottery design|randomi[sz]ed lottery"
    - "cambridge gambling task"
    - "gambl\\w* (on|with) (the|our|their|its|a) (future|economy|lives|health|climate|planet)"
    - "(won|win|winning) .{0,30}(the )?lottery"
    - "standard gamble"                      # health-economics utility elicitation
    - "\\(wager & dixon\\)|wager & dixon"     # botanist, not a bet
    - "procter\\s*(&|&amp;|\\\\&|and)\\s*gamble"       # the company
  # Titles that mark promotional or machine-generated content; dropped outright.
  drop_titles:
    - "promo code|code promo|bonus code|welcome bonus|free spins|no deposit|referral code"
    - "complete guide to|ultimate guide|how to (play|win|bet|develop)|best (online )?(casinos?|betting sites?|sportsbooks?)|top \\d+ (online )?casinos?|casino sites|betting sites|review \\d{4}"
    - "breakthrough mining|leads extracted|provably fair|crypto casino"
  # A record supplied only by OpenAlex needs the subject in its title or this many
  # strong-term matches in its abstract.
  single_source_min_abstract_hits: 2

# Same idea for news headlines: at least one inclusion match.
news_include:
  - "gambl"
  - "\\bbet(s|ting|tor|tors)?\\b"
  - "\\bwager"
  - "sportsbook"
  - "casino"
  - "lotter"
  - "slot machine|\\bslots\\b"
  - "prediction market|event contract|kalshi|polymarket"
  - "self.exclusion"
  - "gaming (board|commission|regulator|control|authority|act)"
  - "daily fantasy|\\bDFS\\b|sweepstakes"
  - "loot box"
  - "\\bodds\\b"
news_exclude:
  - "\\bodds\\b.*(election|poll|weather)"   # "odds" in non-betting senses
  - "video game(s)? (review|sales)"
  # Picks, previews and promo-code content from affiliate sites
  - "\\bvs\\.? .*\\b(odds|picks?|predictions?|preview|props|parlay)\\b"
  - "promo code|bonus code|best bets?\\b|player props|odds today|betting preview|parlay picks|odds, picks|picks and predictions|how to bet on|betting guide|sportsbook promo|sign.up bonus"
  - "hires and higher.ups|people moves|executive (appointments|moves)"
  - "referral code|\\bcode\\b.{0,12}(bonus|free|\\$)|\\$\\d+ (kalshi|polymarket|draftkings|fanduel|betmgm|caesars|bet365)|market combos|\\bcombos\\b|^focus on [A-Z]"

# Bills (title + abstract + subjects). Stricter than news: "gaming" alone is
# video games in many bills, so it needs a gambling context.
bills_include:
  - "gambl"
  - "sports (betting|wagering|book|pool)|sportsbook|\\bbet(s|ting|tors?)?\\b"
  - "\\bwager"
  - "casino|racino|riverboat"
  - "lotter"
  - "slot machine|video gaming terminal|video lottery|electronic gaming|gaming machine|\\bVGTs?\\b|\\bVLTs?\\b"
  - "prediction market|event contract|\\bkalshi\\b"
  - "self.exclusion"
  - "gaming (board|commission|regulat|control|authority|act|compact|facility|facilities|licen[cs]e|operator|revenue|tax|fund)|(charitable|tribal|indian|internet|online|interactive|i)gaming|igaming"
  - "daily fantasy|fantasy (sports|contest)|sweepstakes|pari.?mutuel|horse rac|racetrack|\\bbingo\\b|\\bkeno\\b|\\bpoker\\b|raffle"
  - "loot box"
bills_exclude:
  - "video game (rating|content|violence)"

# Court records (case name + snippet + docket entries).
cases_include:
  - "gambl"
  - "sports (betting|wagering|book)|sportsbook|\\bbetting\\b"
  - "\\bwager"
  - "casino"
  - "lotter"
  - "slot machine|video gaming|gaming machine|gaming device"
  - "prediction market|event contract|kalshi|polymarket"
  - "self.exclusion"
  - "indian gaming|igra\\b|gaming compact|gaming commission|gaming control|gaming board|gaming act|wire act|\\biGaming\\b|internet gaming"
  - "daily fantasy|fantasy sports|draftkings|fanduel|sweepstakes casino|loot box|bookmak"
cases_exclude:
  - "\\bgambl\\w* (on|with) (the|a|his|her|their) (future|life|lives|health|economy)"

news_categories:
  - slug: public-health
    label: public health and treatment
    patterns:
      - "problem gambling|gambling addiction|gambling disorder|gambling harm"
      - "helpline|1-800-GAMBLER|treatment|counsel|self.exclusion|responsible (gambling|gaming)|safer gambling"
      - "public health|suicide|addiction|harm"
  - slug: research
    label: research in the news
    patterns:
      - "\\bstudy\\b|\\bstudies\\b|research|survey|report finds|data show|journal|university|researchers"
  - slug: prediction-markets
    label: prediction markets
    patterns:
      - "prediction market|event contract|kalshi|polymarket|\\bCFTC\\b|robinhood|crypto\\.com|sports event contract"
  - slug: regulation
    label: regulation and law
    patterns:
      - "\\bbill\\b|legislat|lawmaker|senate|house (committee|bill)|governor|attorney general"
      - "lawsuit|court|ruling|judge|appeal|injunction|supreme court|circuit"
      - "regulat|gaming (board|commission|control|authority)|licen[cs]e|\\bban\\b|\\btax\\b|cease.and.desist|settlement|fine[ds]?\\b|enforcement"
  - slug: industry
    label: industry
    patterns:
      - "revenue|handle|earnings|launch|partnership|acquisition|merger|market share|quarter|stock|shares|sportsbook|operator|promo"

# Topics for papers. A paper can carry several.
topics:
