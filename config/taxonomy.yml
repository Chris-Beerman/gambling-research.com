# need a title match or repeated mentions.
topics:
  - slug: sports-betting
    label: sports betting
    patterns: ["sports betting|sports wagering|sports bettor|sportsbook|in.play betting|live betting|\\bparlay|same.game|esports betting|fantasy sports|daily fantasy|football betting|soccer betting|horse (race|racing) betting|racing betting|betting on (sports|football|soccer)|sportwett|apuestas deportivas|paris sportifs"]
