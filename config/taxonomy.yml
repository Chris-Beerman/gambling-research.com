# Study designs. A design counts when its title pattern matches the title, or its
# abstract pattern matches the abstract; abstract patterns are written to catch
# the authors describing their own study ("this randomised controlled trial",
# "we conducted a systematic review"), not studies they cite. For PubMed records
# the publication types assigned by NLM indexers come first (see pubtypes below).
# `suppresses` removes designs that cannot be true at the same time: a protocol
# has no results yet, so it is not also a (completed) trial; a review is not
# itself a survey; a commentary reports no study of its own.
# Designs are shown in the order listed.
designs:
  - slug: protocol
    label: protocol
    title: ["protocol|registered report|study design and rationale"]
    abstract: ["(this|the present|our) (study )?protocol|protocol (for|describes|of) (a|an|the)|this registered report|will be (recruited|randomi[sz]ed|conducted|analy[sz]ed|assessed)"]
    suppresses: [trial]
  - slug: review
    label: review or meta-analysis
    title: ["systematic review|meta.analys|scoping review|umbrella review|narrative review|literature review|rapid review|realist review|integrative review|review of (the )?(literature|evidence|studies|research)|a review\\b|: review|evidence map|bibliometric"]
    abstract: ["(this|our|the present|we (conducted|performed|undertook|carried out)( a)?) (systematic|scoping|umbrella|narrative|rapid|realist|integrative|literature|critical) review|(this|we (conducted|performed)( a)?) meta.analys|\\bPRISMA\\b|we (searched|screened) (\\w+ ){0,3}databases|studies (were|met) (included|the inclusion)"]
    suppresses: [trial, survey, longitudinal, qualitative, experiment, behavioral-data, case-report]
  - slug: trial
    label: randomized trial
    title: ["randomi[sz]ed (controlled |clinical |pilot |feasibility |cluster |online )*(trial|study)|\\bRCT\\b|controlled trial|pilot trial|feasibility trial|field experiment|: a (\\w+ )?trial\\b"]
    abstract: ["(this|a|our|the present|we conducted a|in a) (two.arm |three.arm |multi.?cent(er|re) |single.blind |double.blind |parallel.group |cluster |pragmatic |pilot |feasibility )*(randomi[sz]ed|controlled|clinical) (controlled |clinical |pilot |feasibility )*trial\\b|participants were randomi[sz]ed|were randomly (assigned|allocated) to (receive|an? (intervention|treatment|control|waitlist|wait.list))|randomi[sz]ed to (receive|an? (intervention|treatment|control|waitlist|wait.list))|field experiment"]
  - slug: commentary
    label: commentary or editorial
    title: ["^(commentary|editorial|viewpoint|perspective|opinion|comment|letter|reply|response|correspondence)\\b|: (a )?(commentary|viewpoint|perspective|reply|response|comment)\\b|letter to the editor|a reply to|response to|comment(ary)? on|in case you haven.t heard|editor.s (letter|note)|book review"]
    abstract: ["(this|in this) (commentary|editorial|viewpoint|perspective|essay|opinion piece|letter)"]
    suppresses: [trial, survey, longitudinal, qualitative, experiment, behavioral-data]
  - slug: qualitative
    label: qualitative
    title: ["qualitative|interview|thematic analysis|focus group|grounded theory|ethnograph|phenomenological|lived experience|narratives? of|discourse analysis"]
    abstract: ["qualitative|semi.structured interviews?|in.depth interviews?|(we|were) interviewed|thematic analysis|focus groups?|grounded theory|ethnograph|interpretative phenomenological|discourse analysis|reflexive thematic|(online )?workshops (were|with)|co.design"]
  - slug: survey
    label: survey
    title: ["survey|cross.sectional|questionnaire"]
    abstract: ["(online|national|cross.sectional|population|web.based|household|representative|panel|student|school|community) surveys?|\\bsurveyed\\b|surveys? (data|of|on|was|were|with|study|respondents|participants|wave)|cross.sectional|questionnaires? (was|were) (completed|administered|distributed|used)|completed (an? )?(online |self.report |anonymous )?(survey|questionnaire)|participants completed (\\w+ ){0,3}(measures|questionnaires|surveys|scales)|representative sample|\\brespondents\\b|quantitative data were collected|data (were|was) (drawn|obtained|taken) from (the )?[^.]{0,80}survey"]
  - slug: longitudinal
    label: longitudinal
    title: ["longitudinal|cohort|prospective|panel|follow.up|over time|trajectory (analysis|groups|classes)"]
    abstract: ["longitudinal (study|design|data|analysis|cohort|panel|survey|qualitative)|(this|our|a) longitudinal|cohort (study|data)|prospective (cohort|study|design)|panel (data|study|survey)|waves? of data|(\\d+|two|three|four|five|six|twelve).(month|year) follow.up|follow.up (survey|assessment|data|period|study)|trajectory (analysis|modell?ing|groups|classes)|birth cohort|cross.lagged|interrupted time.series|time.series (analysis|design)"]
  - slug: behavioral-data
    label: behavioral, account or register data
    title: ["account data|player data|transaction|tracking data|administrative data|register|registry|big data|natural experiment|claims data|health records"]
    abstract: ["account data|player (account |tracking )?data|transaction(al)? data|behavio(u)?ral (tracking )?data|tracking data|administrative (health )?data|big data|natural experiment|(national|health|population|patient|care|treatment|death|clinical|nationwide) regist(er|ers|ry|ries)\\b|register.based|registry.based|regist(er|ry) data|claims data|(electronic )?health records|linked data|bank(ing)? (data|transactions)|trading data|transactional|nationwide case.control|diagnosed in [\\w ]{0,30}(specialist|specialized) (health )?care|digital traces|passive(ly)? (collected )?(data|sensing)|health administrative|administrative (health )?databases?|health care databases|universal health (coverage|insurance)|routinely collected|regulatory data|licensing data|emergency department sample|discharge (data|records)"]
  - slug: experiment
    label: lab or online experiment
    title: ["experiment|laboratory|\\blab\\b|simulated|vignette"]
    abstract: ["(?<!natural )(?<!field )(?<!thought )\\bexperiments?\\b|experimental (study|design|paradigm|task|manipulation|condition)|(randomly )?assigned to (one of )?(two|three|four|\\d) (conditions|groups)|in the laboratory|simulated (gambling|slot|betting)|cross.over (design|study)|(slot.machine|gambling|betting|roulette) (paradigm|task)\\b"]
  - slug: case-report
    label: case study or report
    title: ["case report|case study|case series|single.case|a case of"]
    abstract: ["(this|we (present|report|describe)( a)?) case (report|study|series)|single.case"]

# Journals that publish (almost) only reviews: their papers count as reviews
# unless a publication type or the rules say otherwise.
review_journals: "^nature reviews|annual review of|biobehavio(u)?ral reviews|clinical psychology review|current addiction reports|current opinion in|psychological bulletin"

# NLM publication types (PubMed records). When one of these is present it decides
# the design, whatever the rules above say.
pubtypes:
  "randomized controlled trial": trial
  "pragmatic clinical trial": trial
  "clinical trial, phase i": trial
  "clinical trial, phase ii": trial
  "clinical trial, phase iii": trial
  "controlled clinical trial": trial
  "clinical trial protocol": protocol
  "systematic review": review
  "meta-analysis": review
  "scoping review": review
  "review": review
  "editorial": commentary
  "comment": commentary
  "letter": commentary
  "case reports": case-report
  "observational study": null   # neither confirms nor rules out a design
  "validation study": null
# Regions shown on the site. Which countries belong to which region is set in
# pipeline/countries.py, with the country-name patterns.
regions:
  us: {label: United States}
  canada: {label: Canada}
  uk-ireland: {label: UK and Ireland}
  australia-nz: {label: "Australia, New Zealand and Pacific"}
  europe: {label: Europe}
  middle-east: {label: Middle East and North Africa}
  asia: {label: Asia}
  latin-america: {label: Latin America and Caribbean}
  africa: {label: Sub-Saharan Africa}
