# Where the nightly index looks. Every source is optional: a source that fails
# is logged in data/fetch_log.json and shown on /methodology/, and the rest of
# the run continues. Add, disable or re-order sources here; no code changes needed.

pubmed:
  enabled: true
  # PubMed E-utilities. Fields: [tiab] = title/abstract, [mh] = MeSH heading.
  query: >-
    (gambling[tiab] OR gambler[tiab] OR gamblers[tiab] OR gambled[tiab] OR
    gambling[mh] OR "problem gambling"[tiab] OR "gambling disorder"[tiab] OR
    "sports betting"[tiab] OR "sports bettors"[tiab] OR "sports wagering"[tiab] OR
    bettors[tiab] OR "online betting"[tiab] OR wagering[tiab] OR
    lottery[tiab] OR lotteries[tiab] OR "scratch cards"[tiab] OR
    casino[tiab] OR casinos[tiab] OR "slot machine"[tiab] OR "slot machines"[tiab] OR
    "electronic gaming machines"[tiab] OR "poker machines"[tiab] OR
    "loot box"[tiab] OR "loot boxes"[tiab] OR
    "prediction market"[tiab] OR "prediction markets"[tiab] OR
    "event contracts"[tiab] OR "self-exclusion"[tiab] OR "daily fantasy"[tiab] OR
    "esports betting"[tiab])
  # Window for the nightly run (days back by entry date). The first run backfills further.
  days: 14
  backfill_days: 120

openalex:
  enabled: true
  # Boolean search over title + abstract. OpenAlex supports AND / OR / NOT and quoted phrases.
  search: >-
    gambling OR gambler OR gamblers OR "problem gambling" OR "gambling disorder" OR
    "sports betting" OR "sports bettors" OR "sports wagering" OR bettors OR wagering OR
    "online betting" OR lottery OR lotteries OR "scratch cards" OR casino OR casinos OR
    "slot machine" OR "slot machines" OR "electronic gaming machines" OR "poker machines" OR
    "loot box" OR "loot boxes" OR "prediction market" OR "prediction markets" OR
    "event contracts" OR "self-exclusion" OR "daily fantasy" OR "esports betting"
  types: article|review|letter|editorial
  # Journals only: OpenAlex's repository records (Zenodo, OSF) are mostly SEO spam.
  # Preprints come from the medRxiv feed instead.
  source_types: journal
  days: 21
  backfill_days: 120
  # OpenAlex requires a free API key since Feb 13, 2026 (openalex.org/settings/api):
  # set it as the OPENALEX_API_KEY repository secret. OPENALEX_MAILTO is optional.
  mailto: ""

crossref:
  enabled: true
  days: 21
  backfill_days: 120
  # Dedicated gambling journals: everything they register is indexed. Broad journals
  # (Addiction, Addictive Behaviors, ...) are covered by PubMed and OpenAlex.
  journals:
    - name: Journal of Gambling Studies
      issn: ["1573-3602", "1050-5350"]
    - name: International Gambling Studies
      issn: ["1479-4276", "1445-9795"]
    - name: Journal of Gambling Issues
      issn: ["1910-7595"]
    - name: Journal of Behavioral Addictions
      issn: ["2063-5303", "2062-5871"]
    - name: Critical Gambling Studies
      issn: ["2563-190X"]
    - name: Gaming Law Review
      issn: ["2572-5300", "2572-5327"]
    - name: Journal of Financial Therapy
      issn: ["1944-9771", "1945-7774"]

# Journal RSS/Atom feeds. Entries are matched to the same relevance filter as the
# API sources, so broad journals are safe to include.
journal_feeds:
