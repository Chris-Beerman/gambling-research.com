    url: https://onlinelibrary.wiley.com/feed/13600443/most-recent
  - id: addictive-behaviors
    name: Addictive Behaviors
    url: https://rss.sciencedirect.com/publication/science/03064603
  - id: cbp
    name: Cognitive and Behavioral Practice
    url: https://rss.sciencedirect.com/publication/science/10777229
  - id: cgs
    name: Critical Gambling Studies
    url: https://criticalgamblingstudies.com/index.php/cgs/gateway/plugin/WebFeedGatewayPlugin/rss2
    note: standard OJS feed path; confirm on first run
  - id: jgs
    name: Journal of Gambling Studies
    url: https://link.springer.com/search.rss?facet-journal-id=10899&channel-name=Journal+of+Gambling+Studies
    note: Springer search feed; confirm on first run
  - id: ijmha
    name: International Journal of Mental Health and Addiction
    url: https://link.springer.com/search.rss?query=gambling&facet-journal-id=11469&channel-name=IJMHA
