# Site-wide settings. Edit freely; the build reads this file.

title: Gambling Research Index
descriptor: New gambling studies and policy news, indexed nightly, free of industry money
url: https://gambling-research.com
canonical_domain: gambling-research.com
alt_domain: gamblingresearch.net

editor:
  name: Chris Beerman
  credentials: LCSW, CADC
  orcid: 0009-0004-8277-2086

# Placeholder until a mailbox exists for the domain (see README, "Handoff").
contact_email: editor@gambling-research.com

github_repo: Chris-Beerman/gambling-research.com

# How much of the index each page shows.
index_window_days: 90     # /research/ shows studies first seen in this window
topic_window_days: 365    # topic pages
news_window_days: 30      # /news/
home_paper_count: 24
home_news_days: 7
home_news_count: 12

# Display names for journals whose PubMed name differs from the proper one.
journal_names:
  - Frontiers in Psychology
  - Frontiers in Public Health
  - Frontiers in Psychiatry
  - European Psychiatry
  - Journal of American College Health
  - General Hospital Psychiatry
  - Journal of Clinical Oncology
  - BMC Public Health
  - BMJ Open
  - PLOS ONE
  - Journal of Medical Internet Research
  - JMIR Mental Health
  - Addictive Behaviors Reports
  - Comprehensive Psychiatry
  - Journal of Psychiatric Research
  - Psychiatry Research
  - BMC Psychiatry
  - Substance Use & Misuse
  - Journal of Substance Use and Addiction Treatment
  - Health Promotion International
  - Harm Reduction Journal
  - Scientific Reports

# Journals treated as "core" for ranking digest candidates.
core_journals:
  - Journal of Gambling Studies
  - International Gambling Studies
  - Journal of Gambling Issues
  - Journal of Behavioral Addictions
  - Critical Gambling Studies
  - Addiction
  - Addictive Behaviors
  - Psychology of Addictive Behaviors
  - Addiction Research & Theory
  - International Journal of Mental Health and Addiction
  - Gaming Law Review
  - JAMA
  - JAMA Internal Medicine
  - JAMA Psychiatry
  - JAMA Network Open
  - The Lancet
  - The Lancet Public Health
  - The Lancet Psychiatry
  - BMJ
  - Science
  - Nature
  - Nature Human Behaviour
  - American Journal of Psychiatry
  - Drug and Alcohol Dependence
  - Journal of Addiction Medicine
